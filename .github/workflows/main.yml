name: LineageOS 16.0 GSI Builder

on:
  workflow_dispatch:
    inputs:
      BUILD_VARIANT:
        description: '选择要编译的 GSI 变体:'
        required: true
        default: 'arm64_bvN'
        type: choice
        options:
          - 'arm_avN'
          - 'arm_bvN'
          - 'a64_avN'
          - 'a64_bvN'
          - 'arm64_avN'
          - 'arm64_bvN'
      CLEAN_BUILD:
        description: '强制全新编译?'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'

jobs:
  build:
    name: 编译 LineageOS 16.0 GSI（普通 runner）
    runs-on: ubuntu-22.04
    timeout-minutes: 1440
    concurrency:
      group: ${{ github.actor }}-${{ github.event.inputs.BUILD_VARIANT }}
      cancel-in-progress: false

    steps:
      - name: 编译信息
        run: |
          echo "变体: ${{ github.event.inputs.BUILD_VARIANT }}"
          echo "全新编译: ${{ github.event.inputs.CLEAN_BUILD }}"
          nproc
          free -h
          df -h

      - name: 最大化释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
            /opt/google/chrome /usr/local/share/chromium /usr/share/swift \
            /usr/local/.ghcup /opt/microsoft /usr/local/aws-cli || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo swapoff -a || true
          df -h

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python2 python3 openjdk-8-jdk openjdk-11-jdk unzip wget aria2 jq

      - name: 强制 python 指向 python2（LOS16 必需）
        run: |
          mkdir -p ~/.local/bin
          ln -sf /usr/bin/python2 ~/.local/bin/python
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          /usr/bin/python2 --version

      - name: 安装 repo
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: 配置 Git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: 编译（定期列出 system/lib 内容；目标 so 齐全且稳定 5 分钟停）
        env:
          BUILD_VARIANT: ${{ github.event.inputs.BUILD_VARIANT }}
          CLEAN_FLAG: ${{ github.event.inputs.CLEAN_BUILD == 'yes' && '--clean' || '' }}
          POLL_INTERVAL: '30'
          STABLE_SECONDS: '300'
          STALL_SECONDS: '1800'
          DISK_MIN_PERCENT: '5'
        run: |
          set -e

          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"
          echo ">>> python 版本检查:"
          which python
          python --version

          # ===== 官方流程准备 =====
          cd ~
          rm -rf ~/treble_experimentations
          git clone https://github.com/AndyCGYan/treble_experimentations

          rm -rf ~/lineage-16.x-build-gsi
          mkdir -p ~/lineage-16.x-build-gsi
          cd ~/lineage-16.x-build-gsi

          repo init -u https://github.com/LineageOS/android.git -b lineage-16.0
          git clone https://github.com/AndyCGYan/treble_patches treble_patches -b lineage-16.0
          git clone https://github.com/AndyCGYan/treble_build_los treble_build_los -b lineage-16.0

          wget -q -O treble_build_los/buildbot_treble.sh \
            https://github.com/amaxsky/los16.0gsi/raw/refs/heads/main/buildbot_treble.sh
          chmod +x treble_build_los/buildbot_treble.sh
          head -10 treble_build_los/buildbot_treble.sh

          export BUILD_USERNAME=azure
          export BUILD_HOSTNAME=github
          export J_VAL=$(nproc)

          # ===== staging / 记录 =====
          STAGING="$GITHUB_WORKSPACE/upload/libinput"
          MANIFEST="$GITHUB_WORKSPACE/upload/MANIFEST.txt"
          DIRLIST="$GITHUB_WORKSPACE/upload/DIRLIST.txt"
          SYSLIB_SNAPSHOT="$GITHUB_WORKSPACE/upload/SYSLIB_SNAPSHOT.txt"
          mkdir -p "$STAGING"
          : > "$MANIFEST"
          : > "$DIRLIST"
          : > "$SYSLIB_SNAPSHOT"
          echo "STAGING=$STAGING" >> "$GITHUB_ENV"
          echo "MANIFEST=$MANIFEST" >> "$GITHUB_ENV"
          echo "DIRLIST=$DIRLIST" >> "$GITHUB_ENV"
          echo "SYSLIB_SNAPSHOT=$SYSLIB_SNAPSHOT" >> "$GITHUB_ENV"

          # ===== 后台启动编译 =====
          LOG="$HOME/lineage-16.x-build-gsi/build.log"
          setsid bash -c "export PATH='$HOME/.local/bin:$HOME/bin:$PATH'; cd '$HOME/lineage-16.x-build-gsi' && bash treble_build_los/buildbot_treble.sh ${CLEAN_FLAG}" \
            > "$LOG" 2>&1 &
          BUILD_PID=$!
          echo "buildbot PID: $BUILD_PID，日志: $LOG"

          DEADLINE=$(( $(date +%s) + 1380*60 ))
          OUT_BASE="$HOME/lineage-16.x-build-gsi/out"

          LAST_LIBINPUT_COUNT=-1
          LAST_CHANGE_TS=$(date +%s)
          STOP_REASON=""
          SEEN_FILES="$GITHUB_WORKSPACE/upload/seen.txt"
          : > "$SEEN_FILES"
          echo "SEEN_FILES=$SEEN_FILES" >> "$GITHUB_ENV"

          echo ">>> 开始监控..."
          while kill -0 "$BUILD_PID" 2>/dev/null; do
            NOW=$(date +%s)

            # 1) 致命错误
            if grep -qE 'ninja: build stopped|ninja failed with|!!! An error happened|SyntaxError|No space left on device|fatal: ' "$LOG" 2>/dev/null; then
              echo ">>> 日志中发现致命错误，终止编译进程组..."
              STOP_REASON="fatal_error"
              kill -TERM -"$BUILD_PID" 2>/dev/null || kill -TERM "$BUILD_PID" 2>/dev/null || true
              sleep 5
              kill -KILL -"$BUILD_PID" 2>/dev/null || kill -KILL "$BUILD_PID" 2>/dev/null || true
              break
            fi

            # 2) 磁盘 < 5% 兜底
            DISK_PCT=$(df --output=pcent / | tail -1 | tr -d ' %')
            DISK_AVAIL_PCT=$((100 - DISK_PCT))
            if [ "$DISK_AVAIL_PCT" -lt "$DISK_MIN_PERCENT" ]; then
              echo ">>> 磁盘剩余 ${DISK_AVAIL_PCT}% < ${DISK_MIN_PERCENT}%，兜底停止"
              STOP_REASON="disk_low"
              kill -TERM -"$BUILD_PID" 2>/dev/null || kill -TERM "$BUILD_PID" 2>/dev/null || true
              sleep 10
              kill -KILL -"$BUILD_PID" 2>/dev/null || kill -KILL "$BUILD_PID" 2>/dev/null || true
              break
            fi

            # 3) 卡死检测
            LOG_MTIME=$(stat -c %Y "$LOG" 2>/dev/null || echo "$NOW")
            LOG_STALL=$((NOW - LOG_MTIME))
            ACTIVE_PROCS=$(ps -eo pcpu,comm --no-headers 2>/dev/null | \
              awk '$1 > 1 && $2 ~ /^(git|repo|make|ninja|soong_ui|python|python2|python3|clang|clang\+\+|cc1|cc1plus|ld|ld\.lld|java|javac|aapt2|d8|r8|gcc|g\+\+)$/ {c++} END {print c+0}')
            if [ "$LOG_STALL" -ge "$STALL_SECONDS" ] && [ "$ACTIVE_PROCS" -eq 0 ]; then
              echo ">>> build.log 已 ${LOG_STALL}s 未更新且无活跃进程，判定卡死"
              tail -30 "$LOG" || true
              STOP_REASON="stall"
              kill -TERM -"$BUILD_PID" 2>/dev/null || kill -TERM "$BUILD_PID" 2>/dev/null || true
              sleep 5
              kill -KILL -"$BUILD_PID" 2>/dev/null || kill -KILL "$BUILD_PID" 2>/dev/null || true
              break
            fi

            # 4) 找 out
            OUT_DIR=""
            if [ -d "$OUT_BASE/target/product" ]; then
              OUT_DIR=$(find "$OUT_BASE/target/product" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | head -1)
            fi

            if [ -n "$OUT_DIR" ]; then
              # 4.1 定期列出 system/lib 和 system/lib64 的内容
              echo ""
              echo "==================== $(date +%T) system/lib ===================="
              if [ -d "$OUT_DIR/system/lib" ]; then
                ls -la "$OUT_DIR/system/lib" 2>/dev/null | sed 's#^#  #'
              else
                echo "  (system/lib 不存在)"
              fi
              echo "==================== $(date +%T) system/lib64 ===================="
              if [ -d "$OUT_DIR/system/lib64" ]; then
                ls -la "$OUT_DIR/system/lib64" 2>/dev/null | sed 's#^#  #'
              else
                echo "  (system/lib64 不存在)"
              fi
              echo "==============================================================="

              # 把这次快照追加到文件，方便事后查
              {
                echo "===== $(date +%T) system/lib ====="
                ls -la "$OUT_DIR/system/lib" 2>/dev/null || echo "(不存在)"
                echo "===== $(date +%T) system/lib64 ====="
                ls -la "$OUT_DIR/system/lib64" 2>/dev/null || echo "(不存在)"
                echo ""
              } >> "$SYSLIB_SNAPSHOT"

              # 4.2 扫描 libinput*.so（排除 vndk，只算 system/lib* 和 vendor/lib*）
              LIBINPUT_FILES=$(find "$OUT_DIR" \
                \( -path '*/system/lib/*' -o -path '*/system/lib64/*' -o -path '*/vendor/lib/*' -o -path '*/vendor/lib64/*' \) \
                -name 'libinput*.so' ! -path '*/vndk-*' 2>/dev/null || true)
              LIBINPUT_COUNT=$(echo "$LIBINPUT_FILES" | grep -c . || true)

              FLINGER=$(find "$OUT_DIR" \
                \( -path '*/system/lib/*' -o -path '*/system/lib64/*' -o -path '*/vendor/lib/*' -o -path '*/vendor/lib64/*' \) \
                -name 'libinputflinger*.so' ! -path '*/vndk-*' 2>/dev/null | wc -l)
              SERVICE=$(find "$OUT_DIR" \
                \( -path '*/system/lib/*' -o -path '*/system/lib64/*' -o -path '*/vendor/lib/*' -o -path '*/vendor/lib64/*' \) \
                -name 'libinputservice*.so' ! -path '*/vndk-*' 2>/dev/null | wc -l)

              AVAIL_MB=$(df --output=avail -m / | tail -1 | tr -d ' ')

              # 发现新文件：打印路径 + 所在目录
              NEW_COUNT=0
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                grep -qxF "$f" "$SEEN_FILES" 2>/dev/null && continue

                REL="${f#$OUT_DIR/}"
                SAFE=$(echo "$REL" | tr '/' '_')
                DIRNAME=$(dirname "$f")
                SIZE=$(du -h "$f" 2>/dev/null | cut -f1)

                echo ""
                echo "============================================"
                echo "[NEW libinput*.so]"
                echo "  完整路径: $f"
                echo "  相对路径: $REL"
                echo "  大小    : $SIZE"
                echo "  所在目录: $DIRNAME"
                echo "  --- 该目录下所有文件 ---"
                ls -la "$DIRNAME" 2>/dev/null | sed 's#^#    #' || echo "    (目录不可读)"
                echo "============================================"
                echo ""

                {
                  echo "============================================"
                  echo "[$f]"
                  echo "  dir: $DIRNAME"
                  echo "  size: $SIZE"
                  ls -la "$DIRNAME" 2>/dev/null
                  echo ""
                } >> "$DIRLIST"

                cp -f "$f" "$STAGING/$SAFE" 2>/dev/null || true
                echo "$f|$SAFE|$SIZE" >> "$MANIFEST"
                echo "$f" >> "$SEEN_FILES"
                NEW_COUNT=$((NEW_COUNT+1))
              done < <(echo "$LIBINPUT_FILES")

              # 数量变化/稳定
              if [ "$LIBINPUT_COUNT" -ne "$LAST_LIBINPUT_COUNT" ]; then
                LAST_LIBINPUT_COUNT=$LIBINPUT_COUNT
                LAST_CHANGE_TS=$NOW
                echo "[$(date +%T)] 数量变化 → libinput*.so=$LIBINPUT_COUNT (flinger=$FLINGER service=$SERVICE) 新增=$NEW_COUNT 活跃=$ACTIVE_PROCS 磁盘=${DISK_AVAIL_PCT}%/${AVAIL_MB}MB"
              else
                STABLE_FOR=$((NOW - LAST_CHANGE_TS))
                echo "[$(date +%T)] libinput*.so=$LIBINPUT_COUNT (flinger=$FLINGER service=$SERVICE) 稳定=${STABLE_FOR}s/${STABLE_SECONDS}s 新增=$NEW_COUNT 活跃=$ACTIVE_PROCS 磁盘=${DISK_AVAIL_PCT}%/${AVAIL_MB}MB"

                # 停止条件：flinger 和 service 都已出现在 system/vendor lib 下，且数量稳定满 5 分钟
                if [ "$FLINGER" -ge 1 ] && [ "$SERVICE" -ge 1 ] \
                   && [ "$STABLE_FOR" -ge "$STABLE_SECONDS" ] && [ "$LIBINPUT_COUNT" -ge 1 ]; then
                  echo ">>> libinputflinger + libinputservice 已就位且 libinput*.so 稳定 ${STABLE_FOR}s，终止编译..."
                  STOP_REASON="target_so_ready"
                  kill -TERM -"$BUILD_PID" 2>/dev/null || kill -TERM "$BUILD_PID" 2>/dev/null || true
                  sleep 10
                  kill -KILL -"$BUILD_PID" 2>/dev/null || kill -KILL "$BUILD_PID" 2>/dev/null || true
                  break
                fi
              fi
            else
              AVAIL_MB=$(df --output=avail -m / | tail -1 | tr -d ' ')
              echo "[$(date +%T)] 等待 out/target/product 生成...  活跃=$ACTIVE_PROCS  磁盘=${DISK_AVAIL_PCT}%/${AVAIL_MB}MB"
            fi

            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo ">>> 监控超时，强制终止"
              STOP_REASON="timeout"
              kill -KILL -"$BUILD_PID" 2>/dev/null || kill -KILL "$BUILD_PID" 2>/dev/null || true
              break
            fi

            sleep "${POLL_INTERVAL}"
          done

          wait "$BUILD_PID" 2>/dev/null || true
          [ -z "$STOP_REASON" ] && STOP_REASON="process_exit"

          echo ""
          echo "============================================"
          echo ">>> 编译结束，停止原因: $STOP_REASON"
          echo "============================================"
          tail -100 "$LOG" || true

          echo ""
          echo ">>> 最终产物统计："
          OUT_DIR=$(find "$OUT_BASE/target/product" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | head -1)
          if [ -n "$OUT_DIR" ]; then
            echo "out 目录: $OUT_DIR"
            echo "--- system/lib 下的 libinput* ---"
            ls -la "$OUT_DIR/system/lib" 2>/dev/null | grep -E 'libinput' || echo "  (无)"
            echo "--- system/lib64 下的 libinput* ---"
            ls -la "$OUT_DIR/system/lib64" 2>/dev/null | grep -E 'libinput' || echo "  (无)"
            echo "--- 全路径 libinput*.so（排除 vndk）---"
            find "$OUT_DIR" \( -path '*/system/lib/*' -o -path '*/system/lib64/*' -o -path '*/vendor/lib/*' -o -path '*/vendor/lib64/*' \) \
              -name 'libinput*.so' ! -path '*/vndk-*' 2>/dev/null | sed 's#^#  #' || true
            echo "--- obj/SHARED_LIBRARIES 下的 libinput* ---"
            find "$OUT_BASE" -path '*SHARED_LIBRARIES*' -name 'libinput*' 2>/dev/null | head -20 | sed 's#^#  #' || true
          else
            echo "未找到 out 目录"
          fi

          echo ""
          echo ">>> staging 内容："
          ls -la "$STAGING" || true

      - name: 上传产物、清单、system/lib 快照（始终执行）
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: libinput-so-${{ github.run_id }}-${{ github.event.inputs.BUILD_VARIANT }}
          path: |
            upload/libinput/*
            upload/MANIFEST.txt
            upload/DIRLIST.txt
            upload/SYSLIB_SNAPSHOT.txt
            upload/seen.txt
            ~/lineage-16.x-build-gsi/build.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
