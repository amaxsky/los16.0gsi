name: LineageOS 16.0 GSI Builder

on:
  workflow_dispatch:
    inputs:
      BUILD_VARIANT:
        description: '选择要编译的 GSI 变体:'
        required: true
        default: 'arm64_bvN'
        type: choice
        options:
          - 'arm_avN'
          - 'arm_bvN'
          - 'a64_avN'
          - 'a64_bvN'
          - 'arm64_avN'
          - 'arm64_bvN'
      CLEAN_BUILD:
        description: '强制全新编译?'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'

jobs:
  build:
    name: 编译 LineageOS 16.0 GSI（普通 runner）
    runs-on: ubuntu-22.04
    timeout-minutes: 1440
    concurrency:
      group: ${{ github.actor }}-${{ github.event.inputs.BUILD_VARIANT }}
      cancel-in-progress: false

    steps:
      - name: 编译信息
        run: |
          echo "变体: ${{ github.event.inputs.BUILD_VARIANT }}"
          echo "全新编译: ${{ github.event.inputs.CLEAN_BUILD }}"
          nproc
          free -h
          df -h

      - name: 最大化释放磁盘空间
        run: |
          echo "::group::清理前"
          df -h
          echo "::endgroup::"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
            /opt/google/chrome /usr/local/share/chromium /usr/share/swift \
            /usr/local/.ghcup /opt/microsoft /usr/local/aws-cli || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo swapoff -a || true
          echo "::group::清理后"
          df -h
          echo "::endgroup::"

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python2 python3 openjdk-8-jdk openjdk-11-jdk unzip wget aria2 jq

      - name: 强制 python 指向 python2（LOS16 必需）
        run: |
          mkdir -p ~/.local/bin
          ln -sf /usr/bin/python2 ~/.local/bin/python
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          /usr/bin/python2 --version
          ls -la ~/.local/bin/python

      - name: 安装 repo
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: 配置 Git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: 编译（libinput*.so 全部生成且稳定 5 分钟后停止）
        env:
          BUILD_VARIANT: ${{ github.event.inputs.BUILD_VARIANT }}
          CLEAN_FLAG: ${{ github.event.inputs.CLEAN_BUILD == 'yes' && '--clean' || '' }}
          POLL_INTERVAL: '30'        # 轮询间隔（秒）
          STABLE_SECONDS: '300'      # libinput*.so 数量稳定多久判定"全部生成完"（5 分钟）
          STALL_SECONDS: '1800'      # 日志停滞且无活跃进程多久判定卡死（30 分钟，保守）
        run: |
          set -e

          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"
          echo ">>> python 版本检查:"
          which python
          python --version

          # ===== 官方流程准备 =====
          cd ~
          rm -rf ~/treble_experimentations
          git clone https://github.com/AndyCGYan/treble_experimentations

          rm -rf ~/lineage-16.x-build-gsi
          mkdir -p ~/lineage-16.x-build-gsi
          cd ~/lineage-16.x-build-gsi

          repo init -u https://github.com/LineageOS/android.git -b lineage-16.0
          git clone https://github.com/AndyCGYan/treble_patches treble_patches -b lineage-16.0
          git clone https://github.com/AndyCGYan/treble_build_los treble_build_los -b lineage-16.0

          # 替换 buildbot 脚本
          wget -q -O treble_build_los/buildbot_treble.sh \
            https://github.com/amaxsky/los16.0gsi/raw/refs/heads/main/buildbot_treble.sh
          chmod +x treble_build_los/buildbot_treble.sh
          echo ">>> buildbot_treble.sh 前 10 行:"
          head -10 treble_build_los/buildbot_treble.sh

          export BUILD_USERNAME=azure
          export BUILD_HOSTNAME=github
          export J_VAL=$(nproc)

          # ===== 后台启动编译 =====
          LOG="$HOME/lineage-16.x-build-gsi/build.log"
          setsid bash -c "export PATH='$HOME/.local/bin:$HOME/bin:$PATH'; cd '$HOME/lineage-16.x-build-gsi' && bash treble_build_los/buildbot_treble.sh ${CLEAN_FLAG}" \
            > "$LOG" 2>&1 &
          BUILD_PID=$!
          echo "buildbot PID: $BUILD_PID，日志: $LOG"

          DEADLINE=$(( $(date +%s) + 1380*60 ))
          OUT_BASE="$HOME/lineage-16.x-build-gsi/out"

          LAST_LIBINPUT_COUNT=-1
          LAST_CHANGE_TS=$(date +%s)
          INPUTREADER_SEEN=0

          echo ">>> 开始监控产物（libinput*.so 稳定 ${STABLE_SECONDS}s 后停止）..."
          while kill -0 "$BUILD_PID" 2>/dev/null; do
            NOW=$(date +%s)

            # 1) 致命错误检测
            if grep -qE 'ninja: build stopped|ninja failed with|!!! An error happened|SyntaxError|No space left on device|fatal: ' "$LOG" 2>/dev/null; then
              echo ">>> 日志中发现致命错误，终止编译进程组..."
              kill -TERM -"$BUILD_PID" 2>/dev/null || kill -TERM "$BUILD_PID" 2>/dev/null || true
              sleep 5
              kill -KILL -"$BUILD_PID" 2>/dev/null || kill -KILL "$BUILD_PID" 2>/dev/null || true
              break
            fi

            # 2) 卡死检测：日志停滞 且 无活跃编译进程
            LOG_MTIME=$(stat -c %Y "$LOG" 2>/dev/null || echo "$NOW")
            LOG_STALL=$((NOW - LOG_MTIME))

            ACTIVE_PROCS=$(ps -eo pcpu,comm --no-headers 2>/dev/null | \
              awk '$1 > 1 && $2 ~ /^(git|repo|make|ninja|soong_ui|python|python2|python3|clang|clang\+\+|cc1|cc1plus|ld|ld\.lld|java|javac|aapt2|d8|r8|gcc|g\+\+)$/ {c++} END {print c+0}')

            if [ "$LOG_STALL" -ge "$STALL_SECONDS" ] && [ "$ACTIVE_PROCS" -eq 0 ]; then
              echo ">>> build.log 已 ${LOG_STALL}s 未更新，且无活跃编译进程，判定卡死"
              echo "--- 最后 30 行日志 ---"
              tail -30 "$LOG" || true
              echo "--- 相关进程 ---"
              ps aux | grep -E 'repo|buildbot|git|make|ninja|soong' | grep -v grep || true
              echo ">>> 终止编译进程组..."
              kill -TERM -"$BUILD_PID" 2>/dev/null || kill -TERM "$BUILD_PID" 2>/dev/null || true
              sleep 5
              kill -KILL -"$BUILD_PID" 2>/dev/null || kill -KILL "$BUILD_PID" 2>/dev/null || true
              break
            fi

            # 3) 统计 libinput*.so / InputReader 库
            OUT_DIR=""
            if [ -d "$OUT_BASE/target/product" ]; then
              OUT_DIR=$(find "$OUT_BASE/target/product" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | head -1)
            fi

            if [ -n "$OUT_DIR" ]; then
              INPUTREADER_SO=$(find "$OUT_DIR" -path '*/lib*' \
                                \( -name 'libinputflinger*.so' -o -name 'libinputreader*.so' \) \
                                2>/dev/null | wc -l)
              LIBINPUT_COUNT=$(find "$OUT_DIR" -path '*/lib*' -name 'libinput*.so' 2>/dev/null | wc -l)
              AVAIL=$(df --output=avail -m / | tail -1 | tr -d ' ')

              if [ "$INPUTREADER_SO" -ge 1 ]; then
                INPUTREADER_SEEN=1
              fi

              if [ "$LIBINPUT_COUNT" -ne "$LAST_LIBINPUT_COUNT" ]; then
                LAST_LIBINPUT_COUNT=$LIBINPUT_COUNT
                LAST_CHANGE_TS=$NOW
                echo "[$(date +%T)] out=$OUT_DIR  InputReader库=$INPUTREADER_SO  libinput*.so=$LIBINPUT_COUNT  (数量变化，重置稳定计时)  活跃进程=$ACTIVE_PROCS  磁盘=${AVAIL}MB"
              else
                STABLE_FOR=$((NOW - LAST_CHANGE_TS))
                echo "[$(date +%T)] out=$OUT_DIR  InputReader库=$INPUTREADER_SO  libinput*.so=$LIBINPUT_COUNT  (已稳定 ${STABLE_FOR}s/${STABLE_SECONDS}s)  活跃进程=$ACTIVE_PROCS  磁盘=${AVAIL}MB"

                if [ "$INPUTREADER_SEEN" -eq 1 ] && [ "$STABLE_FOR" -ge "$STABLE_SECONDS" ] && [ "$LIBINPUT_COUNT" -ge 1 ]; then
                  echo ">>> libinput*.so 已全部生成并稳定 ${STABLE_FOR}s，终止编译进程组..."
                  kill -TERM -"$BUILD_PID" 2>/dev/null || kill -TERM "$BUILD_PID" 2>/dev/null || true
                  sleep 10
                  kill -KILL -"$BUILD_PID" 2>/dev/null || kill -KILL "$BUILD_PID" 2>/dev/null || true
                  break
                fi
              fi
            else
              AVAIL=$(df --output=avail -m / | tail -1 | tr -d ' ')
              echo "[$(date +%T)] 等待 out/target/product 生成...  活跃进程=$ACTIVE_PROCS  磁盘剩余=${AVAIL}MB"
            fi

            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo ">>> 监控超时，强制终止编译"
              kill -KILL -"$BUILD_PID" 2>/dev/null || kill -KILL "$BUILD_PID" 2>/dev/null || true
              break
            fi

            sleep "${POLL_INTERVAL}"
          done

          wait "$BUILD_PID" 2>/dev/null || true

          echo ">>> 编译进程已结束，日志尾部："
          tail -100 "$LOG" || true

          echo ">>> 最终产物统计："
          OUT_DIR=$(find "$OUT_BASE/target/product" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | head -1)
          if [ -n "$OUT_DIR" ]; then
            echo "out 目录: $OUT_DIR"
            echo "libinput*.so 清单:"
            find "$OUT_DIR" -path '*/lib*' -name 'libinput*.so' 2>/dev/null | sed 's#^#  #'
            echo "libinput*.so 总数: $(find "$OUT_DIR" -path '*/lib*' -name 'libinput*.so' 2>/dev/null | wc -l)"
            echo "InputReader 库:"
            find "$OUT_DIR" -path '*/lib*' \( -name 'libinputflinger*.so' -o -name 'libinputreader*.so' \) 2>/dev/null | sed 's#^#  #'
          else
            echo "未找到 out 目录"
          fi

      - name: 上传编译日志
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: |
            ~/lineage-16.x-build-gsi/build.log
            ~/lineage-16.x-build-gsi/out/error.log
          if-no-files-found: warn
          retention-days: 7
